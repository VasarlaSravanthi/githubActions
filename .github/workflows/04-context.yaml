name: context
# triggers
on: 
  push
env:
  project: "roboshop"
  component: "catalogue"
  enivornment: dev
  
jobs:
  job1: #stage
    outputs:
      version: "${{ steps.ver.outputs.iversion }}"
    runs-on: ubuntu-latest # agent This is github hosted runner
    steps:
      - name: print env variables #step
        run: |
          echo "Project : $project"
          echo "component : $component"
      - name: print github context
        env:
          GITHUB_CONTEXT: ${{ toJSON(github) }}
        run: echo "$GITHUB_CONTEXT"
      
      - name: add variables
        run: |
          echo "course=Githib-Actions" >> $GITHUB_ENV
          echo "duration=5hrs" >> $GITHUB_ENV
      - name: Access in another step variables
        run: |
          echo "course : $course & courseduration : $duration"

      - name: application version
        id: ver
        run: |
         echo "iversion=1.0.0" >> GITHUB_OUTPUT
         
  second-job:
    runs-on: ubuntu-latest
    needs: job1
    steps:
      - name: access another step output
        run: |
          echo "Image-version: ${{ needs.job1.outputs.version }}"

  